# Proposed SemanticMD-based data dictionary format
#
# Describes dataset metadata, resource metadata, tables and columns
# See https://semanticmd.org for more information

semantic-md-version: 0

sections:
- heading_match: |
    # Dataset {id}
  vars: [id]
  patch_add:
    datasets/$id: {}
  patch_path: datasets/$id

  children:
  - match: |
      {desc | md}
    vars: [desc]
    patch_add:
      description: $desc
  - table_match: [Resource, Table, Title]
    row_patch_add:
      resources/-: {"name": $1, "table": $2, "title": $3}

- heading_match: |
    # Table {id}
  vars: [id]
  patch_add:
    tables/$id: {}
  patch_path: tables/$id

  children:
  - table_match: [Column, Type, Label]
    row_patch_add:
      columns/$1/label: $3
    row_submatch:
      $2:
        - filter_match: "required {content}"
          patch_add:
            columns/$1/required: true
        - match: "{typename}"
          vars: [typename]
          patch_add:
            columns/$1/type: $typename

  - table_match: [Primary key]
    row_patch_add:
      primary_key/-: $1

  sections:
  - heading_match: |
      ## Column {id}
    vars: [id]
    patch_path: columns/$id

    children:
    - match: |
        {desc | md}
      vars: [desc]
      patch_add:
        description: $desc
    - match: |
        ### Validation

        Values >= {min}
      vars: [min]
      patch_add:
        validation: {"gte": $min}
    - match: |
        ### Choices

        - {vals | list}
      vars: [vals]
      patch_add:
        choices: $vals

- heading_match: |
    # Resource {id}
  vars: [id]
  patch_path: resources/$id

  children:
  - match: |
      {desc | md}
    vars: [desc]
    patch_add:
      description: $desc

  sections:
  - heading_match: |
      ## Statistics
    children:
    - table_match: [Column, Min, Max, Cardinality, Null Count]
      row_patch_add:
        columns/$1/statistics: {
          "min": $2, "max": $3, "cardinality": $4, "null_count": $5,
        }
    - heading_match: |
        ### Frequency for {col}
      vars: [col]
      patch_path: columns/$col

      children:
      - table_match: [Choice, Frequency]
        row_patch_add:
          frequency/$0: $1
